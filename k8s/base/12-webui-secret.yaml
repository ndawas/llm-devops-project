# Fixed signing key shared across all open-webui replicas, so a JWT issued by
# one pod stays valid when a later request lands on another pod (behind the
# Service or during HPA scale-out). Without this, each replica generates its
# own random key at boot and users get logged out on every request that hits
# a different pod. Demo value for local Minikube use only, change for any
# real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: webui-secret
  namespace: llm-app
type: Opaque
stringData:
  WEBUI_SECRET_KEY: "ceb280924b2021cdc927134f017819d1406396f8ba3bcdb7e5a19c4e2ff8675"
