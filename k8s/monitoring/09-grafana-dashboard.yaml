apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-llm-app
  namespace: monitoring
data:
  llm-app-overview.json: |
    {
      "title": "LLM App Overview (Ollama + Open WebUI)",
      "uid": "llm-app-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pod CPU usage (llm-app)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 3, "min": 0, "custom": { "axisLabel": "cores" } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"llm-app\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod memory usage (llm-app)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"llm-app\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Pod restarts (llm-app)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "lineInterpolation": "stepAfter" } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"llm-app\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Open WebUI HPA replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "max": 3, "custom": { "lineInterpolation": "stepAfter" } }, "overrides": [] },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"llm-app\", horizontalpodautoscaler=\"webui-hpa\"}",
              "legendFormat": "current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"llm-app\", horizontalpodautoscaler=\"webui-hpa\"}",
              "legendFormat": "desired"
            }
          ]
        },
        {
          "id": 5,
          "title": "Node CPU usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU used %"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node memory available (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "legendFormat": "Memory available %"
            }
          ]
        }
      ]
    }
