apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          ports:
            - containerPort: {{ .Values.ollama.service.port }}
          envFrom:
            - configMapRef:
                name: ollama-config
          resources:
            requests:
              cpu: {{ .Values.ollama.resources.requests.cpu | quote }}
              memory: {{ .Values.ollama.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.ollama.resources.limits.cpu | quote }}
              memory: {{ .Values.ollama.resources.limits.memory | quote }}
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          startupProbe:
            exec:
              command: ["ollama", "list"]
            failureThreshold: {{ .Values.ollama.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.ollama.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.startup.timeoutSeconds }}
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: {{ .Values.ollama.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.readiness.timeoutSeconds }}
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: {{ .Values.ollama.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.liveness.timeoutSeconds }}
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
